/* Öz Urfa Kebap rapor stilleri - eski index.html tasarımı birebir, üstüne yıl çubuğu / hariç satır / yazdırma eklendi */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
    font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    padding: 12px 10px; color: #1a2a3a; min-height: 100vh;
    -webkit-text-size-adjust: 100%;
}
.dashboard { max-width: 1200px; margin: 0 auto; }
.brand {
    background: white; border-radius: 24px; padding: 16px 18px; margin-bottom: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05);
}
h1 { font-size: 1.4rem; color: #b45309; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
h1 small { background: #fef3c7; padding: 3px 12px; border-radius: 30px; font-size: 0.6rem; font-weight: 600; color: #92400e; }
.sub { font-size: 0.75rem; color: #4a627a; border-left: 3px solid #f97316; padding-left: 12px; margin-top: 4px; font-weight: 500; }
.yil-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; justify-content: center; }
.yil-btn {
    background: #1e293b; color: #e2e8f0; border: 2px solid #334155; padding: 7px 18px; border-radius: 30px;
    font-weight: 900; font-size: 0.8rem; cursor: pointer; letter-spacing: 0.5px; transition: 0.2s;
}
.yil-btn.active { background: #b45309; border-color: #f59e0b; color: white; box-shadow: 0 4px 12px rgba(180,83,9,0.4); }
.yil-btn:hover:not(.active) { background: #334155; }
.main-button-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; justify-content: center; }
.main-btn {
    background: white; border: 2px solid #e2e8f0; padding: 10px 16px; border-radius: 30px;
    font-weight: 800; font-size: 0.8rem; cursor: pointer; transition: all 0.25s ease;
    display: inline-flex; align-items: center; gap: 5px; color: #2c3e4e;
    box-shadow: 0 3px 8px rgba(0,0,0,0.06); flex: 1 0 auto; justify-content: center; min-width: 80px;
}
.main-btn.active {
    background: #f97316; color: white; border-color: #f97316;
    box-shadow: 0 6px 16px rgba(249,115,22,0.45);
    animation: pulse-active 1.8s 3;   /* 3 kez yanıp durur: sürekli animasyon kasa bilgisayarını ağırlaştırıyordu */
}
@keyframes pulse-active {
    0%, 100% { box-shadow: 0 6px 16px rgba(249,115,22,0.45); transform: scale(1); }
    50% { box-shadow: 0 6px 26px rgba(249,115,22,0.85), 0 0 0 4px rgba(249,115,22,0.2); transform: scale(1.05); }
}
.main-btn:hover:not(.active) { background: #fff3e6; border-color: #fdba74; transform: translateY(-2px); }
.sub-button-bar {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px;
    justify-content: center; padding: 6px 0 10px; border-bottom: 3px solid #e2e8f0;
}
.sub-btn {
    background: #f1f5f9; border: 2px solid #e2e8f0; padding: 7px 12px; border-radius: 25px;
    font-weight: 700; font-size: 0.65rem; cursor: pointer; transition: 0.2s; color: #334155;
    flex: 1 0 auto; text-align: center; min-width: 90px; max-width: 170px;
}
.sub-btn.active {
    background: #f97316; color: white; border-color: #f97316;
    box-shadow: 0 4px 12px rgba(249,115,22,0.35); transform: scale(1.03);
}
.sub-btn:hover:not(.active) { background: #e2e8f0; border-color: #cbd5e1; }
.sub-btn.personel-highlight {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #78350f; border-color: #f59e0b;
    box-shadow: 0 4px 12px rgba(245,158,11,0.4);
}
.sub-btn.personel-highlight.active { background: #f97316; color: white; }
.content-card {
    background: white; border-radius: 20px; box-shadow: 0 10px 24px -6px rgba(0,0,0,0.06);
    overflow: hidden; margin-bottom: 16px;
}
.card-header {
    background: #fef9e8; padding: 10px 14px; border-bottom: 2px solid #ffedd5;
    font-size: 0.95rem; font-weight: 700; color: #9b4a06; display: flex; align-items: center; gap: 6px;
}
.card-body { padding: 12px 14px; }
.table-wrapper { overflow-x: auto; border-radius: 14px; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 0.65rem; min-width: 340px; }
th { background: #f8fafc; padding: 8px 6px; text-align: left; font-weight: 700; color: #1e4a6e; border-bottom: 2px solid #e2edf7; font-size: 0.6rem; }
td { padding: 6px 6px; border-bottom: 1px solid #eff3f8; font-size: 0.65rem; }
.amount-right { text-align: right; font-weight: 600; font-family: monospace; font-size: 0.7rem; }
.method-nakit { background: #e0f2e9; color: #1e6f3f; padding: 2px 8px; border-radius: 16px; display: inline-block; font-weight: 600; font-size: 0.55rem; }
.method-kredi { background: #e1f0fa; color: #1b6b9e; padding: 2px 8px; border-radius: 16px; display: inline-block; font-weight: 600; font-size: 0.55rem; }
.method-ek { background: #f3e8ff; color: #6b21a8; padding: 2px 8px; border-radius: 16px; display: inline-block; font-weight: 600; font-size: 0.55rem; }
.method-haric { background: #dc2626; color: white; padding: 2px 8px; border-radius: 16px; display: inline-block; font-weight: 700; font-size: 0.55rem; }
tr.haric-row { background: #fee2e2; border-left: 4px solid #dc2626; }
tr.haric-row .amount-right { color: #dc2626; text-decoration: line-through; }
.total-row { background: #fef9e8; font-weight: 800; border-top: 2px solid #fbbf24; }
.summary-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.stat-card { flex: 1; min-width: 80px; background: white; border-radius: 16px; padding: 10px 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.03); border: 1px solid #eef2f0; }
.stat-card h4 { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.3px; color: #6c86a3; margin-bottom: 4px; }
.stat-number { font-size: 1rem; font-weight: 800; color: #1e2f3e; }
.profit-card { background: linear-gradient(135deg, #1f3b2c, #2b5a42); color: white; }
.profit-card .stat-number { color: #facc15; }
.profit-card h4 { color: #ffecb3; }
.profit-card.zarar { background: linear-gradient(135deg, #7f1d1d, #b91c1c); }
.avg-card { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; border: 2px solid #60a5fa; }
.avg-card .stat-number { color: #fde047; }
.avg-card h4 { color: #dbeafe; }
.kar-orani-card { background: linear-gradient(135deg, #065f46, #10b981); color: white; border: 2px solid #34d399; }
.kar-orani-card .stat-number { color: #fde047; font-size: 1.4rem; }
.kar-orani-card h4 { color: #d1fae5; }.info-note { background: #eef2ff; border-left: 4px solid #3b82f6; padding: 8px 12px; border-radius: 12px; margin-top: 10px; font-size: 0.65rem; }
.takvim-notu { margin: 0 0 10px; background: #f0fdf4; border-left-color: #16a34a; color: #14532d; font-weight: 700; font-size: 0.7rem; }
.bu-ay-notu { margin: 0 0 10px; background: #eff6ff; border-left-color: #2563eb; color: #1e3a8a; font-size: 0.7rem; line-height: 1.5; }
.gun-bar { height: 5px; background: #e2e8f0; border-radius: 4px; margin-top: 3px; overflow: hidden; min-width: 50px; }
.gun-bar span { display: block; height: 100%; background: linear-gradient(90deg, #f97316, #16a34a); border-radius: 4px; }
tr.kapali-gun td { background: #f8fafc; color: #94a3b8; font-weight: 700; }
tr.bugun-satir td { background: #fff7ed; }
.not-listesi { margin-bottom: 14px; }
.not-listesi .info-note { margin-top: 6px; font-size: 0.7rem; font-weight: 600; background: #fffbeb; border-left-color: #f59e0b; color: #78350f; }
.footer { text-align: center; font-size: 0.55rem; color: #5f7d9c; padding: 14px 0 6px; border-top: 1px solid #e2edf2; margin-top: 12px; line-height: 1.6; }
.positive { color: #15803d; font-weight: 800; }
.negative { color: #dc2626; font-weight: 800; }
.best { color: #15803d; font-weight: 800; }
.worst { color: #dc2626; font-weight: 800; }
.bos-ay { text-align: center; padding: 30px 14px; color: #64748b; font-size: 0.85rem; }
.borclar-card {
    background: linear-gradient(135deg, #fff7ed, #ffedd5);
    border: 3px solid #fb923c; border-radius: 18px; padding: 14px 16px;
    margin-bottom: 14px; box-shadow: 0 6px 18px rgba(251,146,60,0.2);
}
.borclar-card h2 {
    font-size: 1rem; font-weight: 900; color: #9a3412; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px;
}
/* borçlar: kira ayları ve diğer borçlar kart kart (masaüstü 3 sütun, telefon 2), altta toplam */
.borc-alt-baslik { font-size: 0.72rem; font-weight: 900; color: #9a3412; text-transform: uppercase; letter-spacing: 0.4px; margin: 4px 2px 6px; }
.borc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.borclar-card .borc-item {
    display: flex; flex-direction: column; gap: 3px; min-width: 0;
    background: white; border: 1px solid #fed7aa; border-radius: 12px; padding: 9px 12px;
}
.borclar-card .borc-item .borc-ad { font-size: 0.75rem; font-weight: 700; color: #7c2d12; overflow-wrap: anywhere; }
.borclar-card .borc-item .tutar { font-size: 1.05rem; font-weight: 900; color: #c2410c; font-variant-numeric: tabular-nums; }
.borc-degisim { align-self: flex-start; display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 0.62rem; font-weight: 800; }
.borc-degisim.artis { background: #fee2e2; color: #b91c1c; }
.borc-degisim.azalis { background: #dcfce7; color: #166534; }
.borc-degisim.yeni { background: #e0e7ff; color: #3730a3; }
.borclar-card .borc-item.kapandi { opacity: 0.75; background: #f0fdf4; border-color: #bbf7d0; }
.borclar-card .borc-item.kapandi .tutar { color: #15803d; font-size: 0.85rem; }
.borc-toplam {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px;
    background: #9a3412; color: white; border-radius: 12px; padding: 10px 14px; font-weight: 900; font-size: 0.85rem;
}
.borc-toplam.artti { background: #b91c1c; }
.borc-toplam small { display: block; font-size: 0.62rem; font-weight: 700; color: #fed7aa; }
.borc-toplam .tutar { text-align: right; font-size: 1.15rem; font-variant-numeric: tabular-nums; color: #fef3c7; }
.kira-blok { background: white; border: 2px solid #fdba74; border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; }
.kira-baslik { font-weight: 900; color: #7c2d12; font-size: 0.85rem; margin-bottom: 8px; }
.kira-baslik small { display: block; font-weight: 600; color: #9a3412; font-size: 0.65rem; margin-top: 1px; }
.kira-aylar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.kira-satir { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; font-size: 0.75rem; font-weight: 800; color: #1e293b; }
.kira-satir b { font-weight: 800; font-size: 0.78rem; }
.kira-satir.odendi { background: #f0fdf4; border-color: #bbf7d0; }
.kira-satir.odendi b { color: #15803d; }
.kira-satir.bekliyor b { color: #475569; }
.kira-satir.kiragunu { background: #fff7ed; border-color: #fdba74; }
.kira-satir.kiragunu b { color: #c2410c; }
.kira-satir.gecikti { background: #fef2f2; border-color: #fca5a5; }
.kira-satir.gecikti b { color: #dc2626; }
.kira-not { font-size: 0.7rem; color: #7c2d12; padding: 4px; }
.kira-blok .kira-uyari { margin: 8px 0 0; }
.alarm-durum { text-align: center; font-weight: 900; font-size: 0.85rem; border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; }
.alarm-durum.gecti { background: #fbbf24; color: #7f1d1d; }
.alarm-durum.yakin { background: #fef3c7; color: #9a3412; }
.taksit-cipler { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 10px; }
.taksit-cip { background: rgba(255,255,255,0.15); color: #fef3c7; border: 1px solid rgba(255,255,255,0.35); border-radius: 14px; padding: 3px 9px; font-size: 0.68rem; font-weight: 800; }
.taksit-cip.odendi { background: #15803d; border-color: #86efac; color: white; }
.taksit-cip.gecikti { background: #fbbf24; color: #7f1d1d; border-color: #fde68a; }
.duzeltildi { border-bottom: 1px dotted #94a3b8; cursor: help; }
.kira-hatirlat { margin: 0 0 8px; background: #fef2f2; border-left-color: #dc2626; color: #991b1b; font-weight: 800; font-size: 0.72rem; }
.bugun-kart { border: 3px solid #f97316; }
.bugun-kart .card-header { background: linear-gradient(135deg, #fff7ed, #ffedd5); }
.bugun-saat { margin-left: auto; font-size: 0.65rem; color: #64748b; font-weight: 700; }
.bugun-saat.canli { color: #15803d; }
/* canlı: açık (hesabı kapanmamış) masalar */
.acik-masalar { background: #fff7ed; border: 1px solid #fdba74; border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
.acik-masalar.bos { background: #f0fdf4; border-color: #bbf7d0; color: #166534; font-size: 0.72rem; font-weight: 700; }
.acik-ozet {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px; width: 100%; background: none; border: none; padding: 0;
    font: inherit; font-size: 0.75rem; font-weight: 700; color: #7c2d12; text-align: left; cursor: pointer;
}
.detay-dugme { margin-left: auto; background: #f97316; color: white; border-radius: 12px; padding: 3px 10px; font-size: 0.68rem; font-weight: 800; }
.adisyon-listesi { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.adisyon { background: white; border: 1px solid #fed7aa; border-radius: 10px; }
.adisyon.acik { border-color: #f97316; }
.adisyon-baslik { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; font-size: 0.72rem; font-weight: 700; color: #1e293b; cursor: pointer; }
.adisyon-baslik > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.adisyon-sag { white-space: nowrap; color: #475569; font-weight: 600; }
.adisyon-sag b { color: #c2410c; }
.adisyon-icerik { border-top: 1px dashed #fdba74; padding: 4px 10px 6px; background: #fffbeb; border-radius: 0 0 10px 10px; }
.urun { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font-size: 0.7rem; color: #334155; }
.urun.alt { margin-top: 3px; padding-top: 4px; border-top: 1px solid #fde68a; font-size: 0.64rem; color: #64748b; font-weight: 700; }
.borclar-card .kira-uyari {
    background: #dc2626; color: white; padding: 8px 12px; border-radius: 10px;
    font-size: 0.8rem; font-weight: 900; text-align: center; margin-bottom: 10px; letter-spacing: 0.5px;
}
.borclar-card .kira-ok {
    background: #15803d; color: white; padding: 8px 12px; border-radius: 10px;
    font-size: 0.8rem; font-weight: 900; text-align: center; margin-bottom: 10px; letter-spacing: 0.5px;
}
.borclar-card .elektrik-uyari {
    background: linear-gradient(135deg, #7f1d1d, #dc2626); color: white;
    padding: 10px 12px; border-radius: 12px; margin-bottom: 10px;
    border: 2px solid #fbbf24; text-align: center;
}
.borclar-card .elektrik-uyari .title { font-size: 0.85rem; font-weight: 900; letter-spacing: 0.5px; color: #fef3c7; margin-bottom: 4px; }
.borclar-card .elektrik-uyari .amount { font-size: 1rem; font-weight: 900; font-family: monospace; color: #fde047; }
.borclar-card .elektrik-uyari .detail { font-size: 0.7rem; color: #fef3c7; margin-top: 4px; font-weight: 700; }
.kategori-list { display: flex; flex-direction: column; gap: 8px; }
.kategori-item { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px; overflow: hidden; transition: 0.2s; }
.kategori-item:hover { border-color: #fdba74; }

.elektrik-alarm .row:last-child { border-bottom: none; }

            komisyon, platformlar, onlineBrut, onlineNet, nakitGelir, krediGelir, brut, net,
            nakitGider, krediGider, ekGider, personelGider, toplamGider, netKar, haricToplam, calismaGunu,
            karOrani: net ? netKar / net * 100 : 0,
            gunlukCiro: calismaGunu ? net / calismaGunu : 0
        };
    }
    // ortalamalara yalnızca biten aylar girer (içinde bulunulan yarım ay ortalamayı aşağı çekmesin)
    function ortalama(aylar) {
        const buAy = yerelTarih(new Date()).slice(0, 7);
        const gecerli = aylar.filter(a => a.id !== buAy).map(a => hesapla(a)).filter(h => h.net > 0);
        const toplam = gecerli.reduce((s, h) => s + h.net, 0);
        const gun = gecerli.reduce((s, h) => s + h.calismaGunu, 0);
        return { adet: gecerli.length, aylik: gecerli.length ? toplam / gecerli.length : 0, gunluk: gun ? toplam / gun : 0 };
    }

    // ------------------------------------------------------------ parçalar

        return `<div class="brand"><h1>🧾 ${esc(D.veri.isletme || 'ÖZ URFA KEBAP')} ${son ? `<small>${ayAdi(son.id)} ${ayParca(son.id).yil} Güncel</small>` : ''}</h1><div class="sub">${esc(alt)}</div>${arac}</div>`;

    function yilBarHtml(aylar) {

    function ayBarHtml(yilAylari) {
        return `<div class="main-button-bar">${yilAylari.map(a => `<button class="main-btn${a.id === D.ay ? ' active' : ''}" data-ay="${a.id}">${ayIkon(a.id)} ${ayAdi(a.id)}</button>`).join('')}</div>`;

    function altBarHtml(ay) {
        const ad = ayAdi(ay.id);
        const etiket = { ozet: `📊 ${ad} Özeti`, gunluk: '📅 Günlük Ciro', personel: `👥 ${ad} Personel`, nakit: '💰 Kasadan Yapılan Nakit', kredi: '💳 Yusuf Usta Kredi/EFT', tumgider: '📋 Genel Tüm Gider', karsilastirma: '📈 Ay Karşılaştırma' };
        return `<div class="sub-button-bar">${sekmeler(ay).map(s => `<button class="sub-btn${s === 'personel' ? ' personel-highlight' : ''}${s === D.sekme ? ' active' : ''}" data-sekme="${s}">${etiket[s]}</button>`).join('')}</div>`;
    }

    // "Günlük Ciro" sekmesi yalnızca günlük verisi olan aylarda (SambaPOS'tan çekilen) görünür
    function sekmeler(ay) { return SEKMELER.filter(s => s !== 'gunluk' || (ay.gunluk || []).length); }

    // "2 Kasım" (yıl bu yıldan farklıysa "2 Ocak 2027")
    function gunAyYaz(d) { return d.getDate() + ' ' + AY_ADLARI[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); }
    function alarmlarHtml(ay) {
        return gosterilenAlarmlar(ay).map(a => {
            const p = takipPlani(ay, a);
            if (!p) return `
            <div class="elektrik-alarm">
                <h2>${esc(a.ikon || '⚡')} ${esc(a.baslik)} — BORÇ</h2>
                <div class="row"><span>${/ceza/i.test(a.baslik || '') ? 'TOPLAM CEZA' : 'TOPLAM'}</span><span class="val">${para(a.toplam, 2)} ₺</span></div>
                ${sayi(a.taksitSayisi) ? `<div class="row"><span>TAKSİT</span><span class="val">${sayi(a.taksitSayisi)} × ${para(a.taksit)} ₺</span></div>` : ''}
                ${a.ilkOdeme ? `<div class="row"><span>İLK TAKSİT</span><span class="val">${esc(a.ilkOdeme)}</span></div>` : ''}
                ${a.periyod || a.ilkOdeme ? `<div style="text-align:center;"><span class="date-badge">📅 ÖDEME: ${esc(a.periyod || '-')}${a.ilkOdeme ? ' · İLK: ' + esc(a.ilkOdeme) : ''}</span></div>` : ''}
                ${a.not ? `<div style="text-align:center;margin-top:8px;font-size:0.7rem;color:#fef3c7;">⚠️ ${esc(a.not)}</div>` : ''}
            </div>`;
            // en güncel ayda: sade taksit takibi
            const s = p.siradaki;
            const durum = !s ? '' : (s.gecikti ? `<div class="alarm-durum gecti">❌ ${s.no}. taksit ödenmedi — ödeme günü ${gunAyYaz(s.tarih)} idi (${gunFarki(new Date(), s.tarih)} gün geçti)</div>`
                : (s.yakin ? `<div class="alarm-durum yakin">⏰ ${s.no}. taksitin ödeme günü ${gunFarki(new Date(), s.tarih) === 0 ? 'BUGÜN' : gunAyYaz(s.tarih)}</div>` : ''));
            // sade kart: dört kutu yan yana (telefonda 2×2), altında taksit çipleri
            const kutu = (etiket, deger, alt) => `<div class="alarm-kutu"><span>${etiket}</span><b>${deger}</b>${alt ? `<small>${alt}</small>` : ''}</div>`;
            return `
            <div class="elektrik-alarm sade${s && (s.gecikti || s.yakin) ? ' acil' : ''}">
                <h2>${esc(a.ikon || '⚡')} ${esc(a.baslik)} — BORÇ<small>Her ay ${para(a.taksit)} ₺ · ${esc(a.periyod || '')} · ${p.n} taksit</small></h2>
                ${durum}
                <div class="alarm-kutular">
                    ${kutu('Toplam borç', para(p.odenenTutar + p.kalanTutar, 2) + ' ₺')}
                    ${kutu('Ödenen', para(p.odenenTutar, 2) + ' ₺', p.odenen + ' taksit')}
                    ${kutu('Kalan', para(p.kalanTutar, 2) + ' ₺', p.kalanAdet + ' taksit')}
                    ${s ? kutu('Sıradaki ödeme', s.tarih ? gunAyYaz(s.tarih) : '—', s.no + '. taksit · ' + para(s.miktar, s.miktar % 1 ? 2 : 0) + ' ₺') : ''}
                </div>
                <div class="taksit-cipler">${p.liste.map(t => {
                    const od = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t.odemeTarihi || '');
                    const gun = od ? new Date(+od[1], +od[2] - 1, +od[3]) : t.tarih;
                    return `<span class="taksit-cip${t.odendi ? ' odendi' : (t.gecikti || t.yakin ? ' gecikti' : '')}" title="${t.odendi ? 'ödendi' + (od ? ' ' + gunAyYaz(gun) : '') : 'ödeme günü ' + (t.tarih ? gunAyYaz(t.tarih) : '')}">${t.no}. ${t.odendi ? '✅' : (t.gecikti ? '❌' : (t.yakin ? '⏰' : '⏳'))}${gun ? ' ' + gunAyYaz(gun) : ''}</span>`;
                }).join('')}</div>
                ${a.not ?`<div style="text-align:center;margin-top:8px;font-size:0.7rem;color:#fef3c7;">📝 ${esc(a.not)}</div>` : ''}
            </div>`;
        }).join('');
    }
    // ---- kira ay sonunda ödenir: bir ayın kirası SONRAKİ ayın kiraOdemeGunu.bas–son günlerinde (varsayılan 1–2).
    // Hatırlatma ayın son gününden başlar, son ödeme günü geçince gecikme sayılır. Vadesi gelmemiş kira "ödenmedi" sayılmaz.
    function kiraTutari(ay) { return sayi((ay.kira || {}).tutar) || sayi(D.veri.kiraTutari) || 45000; }
    function kiraGunleri() { const g = D.veri.kiraOdemeGunu || {}; return { bas: sayi(g.bas) || 1, son: sayi(g.son) || 2 }; }
    function kiraVade(ay) { const p = ayParca(ay.id); return new Date(p.yil, p.ay, kiraGunleri().son); }        // sonraki ayın son ödeme günü
    function kiraVadeBas(ay) { const p = ayParca(ay.id); return new Date(p.yil, p.ay, kiraGunleri().bas); }
    function kiraHatirlatmaBas(ay) { const p = ayParca(ay.id); return new Date(p.yil, p.ay, 0); }            // ayın son günü
    function gunFarki(a, b) { return Math.round((new Date(a.getFullYear(), a.getMonth(), a.getDate()) - new Date(b.getFullYear(), b.getMonth(), b.getDate())) / 864e5); }
    // 'odendi' | 'bekliyor' (vadesi gelmedi) | 'kiragunu' (ayın son günü … son ödeme günü) | 'gecikti' | '' (takip yok)
    function kiraHali(ay) {
        const k = ay.kira || {};
        if (k.durum === 'odendi') return 'odendi';
        if (k.durum !== 'odenmedi') return '';
        const bugun = new Date();
        if (gunFarki(bugun, kiraHatirlatmaBas(ay)) < 0) return 'bekliyor';
        return gunFarki(bugun, kiraVade(ay)) <= 0 ? 'kiragunu' : 'gecikti';
    }
    function kiraDurumu(ay) {
        // bu aya kadar (dahil) vadesi gelmiş ve ödenmemiş aylar
        const onceki = aylarSirali(D.veri).filter(a => a.id <= ay.id && a.kira && a.kira.durum && kiraHali(a) !== 'bekliyor').reverse();   // eskiden yeniye
        const odenmeyen = onceki.filter(a => a.kira.durum === 'odenmedi');
        let ardisik = 0;
        for (let i = onceki.length - 1; i >= 0 && onceki[i].kira.durum === 'odenmedi'; i--) ardisik++;
        return { odenmeyen, ardisik, toplam: odenmeyen.reduce((s, a) => s + kiraTutari(a), 0) };
    }
    function kiraOdemeAraligi(ay) { const b = kiraVadeBas(ay), s = kiraVade(ay); return (b.getDate() === s.getDate() ? '' : b.getDate() + '–') + gunAyYaz(s); }
    // tek ayın kira durumu, herkesin anlayacağı sözlerle
    function kiraDurumYazisi(ay) {
        const h = kiraHali(ay), k = ay.kira || {}, aralik = kiraOdemeAraligi(ay);
        if (h === 'odendi') {
            const ot = /^(\d{4})-(\d{2})-(\d{2})$/.exec(k.odemeTarihi || '');
            if (!ot) return '✅ Ödendi';
            const t = new Date(+ot[1], +ot[2] - 1, +ot[3]), gec = gunFarki(t, kiraVade(ay));
            return `✅ Ödendi (${gunAyYaz(t)}${gec > 0 ? `, ${gec} gün geç` : ''})`;
        }
        if (h === 'bekliyor') return `⏳ ${aralik} günü ödenecek`;
        if (h === 'kiragunu') return `⏰ Ödeme günü geldi: ${aralik}`;
        if (h === 'gecikti') return `❌ ÖDENMEDİ (${gunFarki(new Date(), kiraVade(ay))} gün geçti)`;
        return '';
    }
    function kiraVadeMetni(ay) { return `${ayAdi(ay.id)} kirası: ${kiraDurumYazisi(ay)}`; }
    // eski rapordan taşınan sabit "KİRA N AYDIR ÖDENMEDİ — …" yazısı yok sayılır: durum her zaman ödendi/ödenmedi seçimlerinden
    function kiraOzelYazi(k) { return k.metin && !/KİRA\s+\d+\s+AYDIR\s+ÖDENMEDİ/i.test(k.metin) ? k.metin : ''; }
    // Kira listesi: son 3 ay alt alta (Ağustos ✅ ödendi · Eylül ✅ ödendi · Ekim ⏳ 1–2 Kasım günü ödenecek);
    // günü geçmiş ödenmemiş kira varsa altında kırmızı toplam
    function kiraHtml(ay) {
        if (!kiraHali(ay)) return '';
        const aylar = aylarSirali(D.veri).filter(a => a.id <= ay.id && kiraHali(a)).slice(0, 3).reverse();
        const satirlar = aylar.map(a => `<div class="kira-satir ${kiraHali(a)}"><span>${ayAdi(a.id)}${ayParca(a.id).yil !== ayParca(ay.id).yil ? ' ' + ayParca(a.id).yil : ''}</span><b>${esc(kiraDurumYazisi(a))}</b></div>`).join('');
        const d = kiraDurumu(ay);
        const ozel = kiraOzelYazi(ay.kira || {});
        const g = kiraGunleri();
        return `<div class="kira-blok">
            <div class="kira-baslik">🏠 KİRA <small>aylık ${para(kiraTutari(ay))} ₺ · her ayın kirası sonraki ayın ${g.bas === g.son ? g.son : g.bas + '–' + g.son}'sinde ödenir</small></div>
            <div class="kira-aylar">${satirlar}</div>
            ${ozel ? `<div class="kira-not">📝 ${esc(ozel)}</div>` : ''}
            ${d.odenmeyen.length ? `<div class="kira-uyari">⚠️ ÖDENMEMİŞ KİRA: ${esc(d.odenmeyen.map(a => ayAdi(a.id)).join(', '))} — toplam ${para(d.toplam)} ₺</div>` : ''}
        </div>`;
    }
    // ---- taksitli borç (elektrik cezası vb.): taksit tarihleri, ödenen / kalan / sıradaki / gecikti
    function tarihOku(s) { const m = /(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(s || ''); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; }
    function tarihYaz(d) { return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear(); }
    function taksitPlani(a) {
        const n = Math.round(sayi(a.taksitSayisi));
        if (!n) return null;
        const ilk = tarihOku(a.ilkOdeme), gunM = /(\d{1,2})/.exec(a.periyod || ''), gun = gunM ? +gunM[1] : (ilk ? ilk.getDate() : 0);
        const tutar = sayi(a.taksit), toplam = sayi(a.toplam) || tutar * n;
        const odenen = Math.min(n, Math.max(0, Math.round(sayi(a.odenenTaksit))));
        const bugun = new Date(); bugun.setHours(0, 0, 0, 0);
        const liste = [];
        let tarih = ilk;
        for (let i = 1; i <= n; i++) {
            if (i > 1 && tarih) {   // sonraki taksit: önceki tarihten sonraki ilk "ödeme günü" (ör. her ayın 25'i)
                const t = new Date(tarih.getFullYear(), tarih.getMonth(), gun);
                tarih = t > tarih ? t : new Date(tarih.getFullYear(), tarih.getMonth() + 1, gun);
            }
            const miktar = i < n ? tutar : (Math.round(Math.max(0, toplam - tutar * (n - 1)) * 100) / 100 || tutar);   // son taksit: kalan kuruşlar
            // kira gibi: ödeme gününe 2 gün kala ve ödeme günü "taksit günü", geçince gecikti
            const fark = tarih ? gunFarki(bugun, tarih) : null;
            liste.push({
                no: i, tarih, miktar, odendi: i <= odenen, odemeTarihi: (a.odemeler || [])[i - 1] || '',
                gecikti: i > odenen && fark != null && fark > 0, yakin: i > odenen && fark != null && fark <= 0 && fark >= -2
            });
        }
        const kalanlar = liste.filter(t => !t.odendi);
        return {
            liste, n, odenen, kalanAdet: kalanlar.length,
            odenenTutar: liste.filter(t => t.odendi).reduce((s, t) => s + t.miktar, 0),
            kalanTutar: kalanlar.reduce((s, t) => s + t.miktar, 0),
            siradaki: kalanlar[0] || null, geciken: kalanlar.filter(t => t.gecikti).length
        };
    }
    // taksit takibi yalnızca en güncel ayda (eski ayların kopyası güncellenmez; orada eski haliyle kalır)
    function takipPlani(ay, a) { const son = aylarSirali(D.veri)[0]; return son && son.id === ay.id ? taksitPlani(a) : null; }
    // tüm taksitleri ödenmiş borç kartı raporda gösterilmez (yeni aylara da kopyalanmaz)
    function borcBitti(a) { const p = taksitPlani(a); return !!p && p.kalanAdet === 0; }
    function gosterilenAlarmlar(ay) { return (ay.alarmlar || []).filter(a => a && (a.baslik || a.toplam) && !borcBitti(a)); }
    function taksitOzetMetni(p) {
        if (!p) return '';
        if (!p.kalanAdet) return `✅ ${p.n}/${p.n} taksit ödendi, borç bitti`;
        const s = p.siradaki;
        return `${p.odenen}/${p.n} taksit ödendi · kalan ${p.kalanAdet} taksit, ${para(p.kalanTutar, 2)} ₺ · sıradaki ${s.no}. taksit${s.tarih ? ' ' + tarihYaz(s.tarih) : ''}${p.geciken ? ` · ⚠️ ${p.geciken} taksit gecikti` : (s.yakin ? ' · ⏰ taksit günü' : '')}`;
    }
    // Bugün kartı için: sıradaki taksitin günü geldiyse ya da geçtiyse hatırlatma (kira hatırlatması gibi)
    function taksitHatirlatmalari(ay) {
        return gosterilenAlarmlar(ay).map(a => {
            const p = takipPlani(ay, a), s = p && p.siradaki;
            if (!s || !(s.gecikti || s.yakin) || !s.tarih) return '';
            const g = gunFarki(new Date(), s.tarih);
            return `<div class="info-note kira-hatirlat">${esc(a.ikon || '⚡')} ${esc(cumleYaz(a.baslik))} ${s.no}. taksit (${para(s.miktar, s.miktar % 1 ? 2 : 0)} ₺): ${s.gecikti ? `❌ ödenmedi — ödeme günü ${gunAyYaz(s.tarih)} idi (${g} gün geçti)` : `⏰ ödeme günü ${g === 0 ? 'BUGÜN' : gunAyYaz(s.tarih)}`}</div>`;
        }).join('');
    }

    function borclarHtml(ay) {
        // taksitli borçlar (elektrik cezası) yalnızca üstteki büyük kırmızı kartta; burada tekrar edilmez
        let items = kiraHtml(ay);
        // geçen aya göre değişim (aynı adlı borç): ▲ arttı, ▼ azaldı, yeni, kapandı + toplam
        const karsilastir = D.veri.borcDegisim !== false;
        const onceki = karsilastir ? aylarSirali(D.veri).find(a => a.id < ay.id) : null;
        const anahtar = b => trKucuk(b.ad).trim();
        const borcTutari = b => sayi(b.tutar) || (b.metin && /^[\d.,\s]+(tl|₺)?$/i.test(b.metin.trim()) ? sayi(b.metin.replace(/[^\d,]/g, '').replace(',', '.')) : 0);
        const oncekiler = {};
        if (onceki) (onceki.borclar || []).forEach(b => { if (b.ad) oncekiler[anahtar(b)] = b; });
        // değişmeyen borçta rozet yok (her satırda "aynı" yazısı kalabalık yapıyordu); yalnız artış/azalış/yeni görünür
        const fark = (simdi, eski) => {
            const f = simdi - eski;
            if (!f) return '';
            return f > 0 ? `<span class="borc-degisim artis" title="geçen ay ${para(eski)} ₺">▲ ${para(f)}</span>` : `<span class="borc-degisim azalis" title="geçen ay ${para(eski)} ₺">▼ ${para(-f)}</span>`;
        };
        // her borç bir kart (masaüstünde 3, telefonda 2 sütun); altta kira ve elektrik hariç toplam
        let kartlar = '', toplam = 0, oncekiToplam = 0, sayilan = 0;
        (ay.borclar || []).forEach(b => {
            // "21.000 TL" gibi yazılmış tutarlar da diğerleriyle aynı biçimde (₺)
            const deger = b.metin ? (borcTutari(b) && !sayi(b.tutar) ? para(borcTutari(b)) + ' ₺' : esc(b.metin)) : (sayi(b.tutar) ? para(b.tutar) + ' ₺' : '');
            if (!deger) return;
            const simdi = borcTutari(b), eski = oncekiler[anahtar(b)];
            let degisim = '';
            if (onceki) {
                if (!eski) degisim = '<span class="borc-degisim yeni">yeni</span>';
                else if (simdi && borcTutari(eski)) degisim = fark(simdi, borcTutari(eski));
                delete oncekiler[anahtar(b)];
            }
            if (simdi) { toplam += simdi; sayilan++; }
            kartlar += `<div class="borc-item"><span class="borc-ad">${esc(ikon(b.ikon, '💸'))} ${esc(b.ad)}</span><span class="tutar">${deger}</span>${degisim}</div>`;
        });
        if (onceki) {
            Object.keys(oncekiler).forEach(k => {
                const b = oncekiler[k];
                if (borcTutari(b)) kartlar += `<div class="borc-item kapandi"><span class="borc-ad">${esc(ikon(b.ikon, '💸'))} ${esc(b.ad)}</span><span class="tutar">✅ Kapandı</span><span class="borc-degisim azalis">geçen ay ${para(borcTutari(b))} ₺</span></div>`;
            });
            (onceki.borclar || []).forEach(b => { oncekiToplam += borcTutari(b); });
        }
        if (kartlar) items += `<div class="borc-alt-baslik">Diğer borçlar</div><div class="borc-grid">${kartlar}</div>`;
        if (sayilan || oncekiToplam) {
            const degisimYazisi = !onceki ? '' : (toplam === oncekiToplam ? 'geçen aydan değişmedi'
                : `geçen ay ${para(oncekiToplam)} ₺ · ${toplam > oncekiToplam ? '▲ ' + para(toplam - oncekiToplam) + ' ₺ arttı' : '▼ ' + para(oncekiToplam - toplam) + ' ₺ azaldı'}`);
            items += `<div class="borc-toplam${onceki && toplam > oncekiToplam ? ' artti' : ''}"><span>Σ Toplam borç <small>kira ve elektrik hariç</small></span><span class="tutar">${para(toplam)} ₺${degisimYazisi ? `<small>${degisimYazisi}</small>` : ''}</span></div>`;
        }
        return items ? `<div class="borclar-card"><h2>💸 BORÇLAR</h2>${items}</div>` : '';
    }
    function notlarHtml(ay) {
        const n = (ay.notlar || []).filter(x => String(x).trim());
        return n.length ? `<div class="not-listesi">${n.map(x => `<div class="info-note">📝 ${esc(x)}</div>`).join('')}</div>` : '';
    }

    // krediEtiket: kredi sekmesinde "Kredi/EFT", tüm gider ve kategori listelerinde "Kredi" (eski rapordaki gibi)
    function giderSatiri(g, krediEtiket) {
        const rozet = g.haric
            ? `<span class="method-haric">⚠️ ${esc(g.not || 'GİDERE DAHİL DEĞİL')}</span>`
            : (g.tur === 'kredi' ? `<span class="method-kredi">${krediEtiket || 'Kredi'}</span>` : '<span class="method-nakit">Nakit</span>');
        const metin = duzelt(g.aciklama), degisti = metin !== String(g.aciklama || '').trim();
        const aciklama = `<span${degisti ? ` class="duzeltildi" title="Yazılan: ${esc(g.aciklama)}"` : ''}>${esc(metin)}</span>`;
        return `<tr${g.haric ? ' class="haric-row"' : ''}><td style="white-space:nowrap;">${tarihKisa(g.tarih)}</td><td>${g.haric ? '<strong>' + aciklama + '</strong>' : aciklama}</td><td>${rozet}</td><td class="amount-right">${g.haric ? para(g.tutar, 2) : tutarYaz(g.tutar)} ₺</td></tr>`;
    }
    // hariç tutulan kaydın uyarı kartı (aynı tutarlı ceza/borç kartı) varsa taksit bilgisi notta görünür
    function haricAlarmi(ay, g) {
        return (ay.alarmlar || []).find(a => sayi(a.toplam) && Math.abs(sayi(a.toplam) - sayi(g.tutar)) <= Math.max(10, sayi(a.toplam) * 0.01));
    }
    function haricNotlari(ay, liste) {
        return liste.filter(g => g.haric).map(g => {
            const a = haricAlarmi(ay, g);
            const neden = /ödenmedi/i.test(g.not || '') ? 'ödenmediği için toplam gidere' : 'toplam gidere';
            return `<div class="info-note" style="margin-top:10px;background:#fef3c7;border-left-color:#dc2626;color:#7c2d12;font-size:0.7rem;font-weight:700;">${a ? esc(a.ikon || '⚡') : '⚠️'} <strong>${esc(a ? a.baslik : g.aciklama)} ${para(g.tutar, 2)} ₺</strong> listelenmiştir ancak <strong>${neden} dahil edilmemiştir</strong>.${a && sayi(a.taksitSayisi) ? `<br>📅 ${sayi(a.taksitSayisi)} taksit × ${para(a.taksit)} ₺${a.ilkOdeme ? ' · İlk taksit: ' + esc(a.ilkOdeme) : ''}` : ''}</div>`;
        }).join('');
    }
    function giderTablosu(ay, baslik, liste, toplamEtiket, krediEtiket) {
        const hariclar = liste.filter(g => g.haric), digerleri = tarihSirali(liste.filter(g => !g.haric));
        const toplam = digerleri.reduce((s, g) => s + sayi(g.tutar), 0);
        const satirlar = hariclar.concat(digerleri).map(g => giderSatiri(g, krediEtiket)).join('') || '<tr><td colspan="4" style="text-align:center;color:#64748b;">Kayıt yok</td></tr>';
        let ek = '';
        if (hariclar.length) {
            const adlar = hariclar.map(g => { const a = haricAlarmi(ay, g); return a ? cumleYaz(String(a.baslik || '').split(/\s+/)[0]) : ''; });
            ek = adlar.every(Boolean) ? ` (${[...new Set(adlar)].join(', ')} Hariç)` : ' (Hariç Tutulanlar Dahil Değil)';
        }
        return `<div class="content-card"><div class="card-header">${baslik}</div><div class="card-body"><div class="table-wrapper"><table><thead><tr><th>Tarih</th><th>Açıklama</th><th>Tür</th><th>Tutar</th></tr></thead><tbody>${satirlar}<tr class="total-row"><td colspan="3"><strong>${toplamEtiket}${ek}</strong></td><td class="amount-right"><strong>${tutarYaz(toplam)} ₺</strong></td></tr></tbody></table></div>${haricNotlari(ay, liste)}</div></div>`;
    }

    function kategoriHtml(ay) {
        const ad = ayAdi(ay.id);
        const grup = {};
        KATEGORILER.forEach(([k]) => { grup[k] = { items: [], total: 0 }; });
        const sayilanlar = (ay.giderler || []).filter(g => !g.haric);
        tarihSirali(sayilanlar).forEach(g => { const k = kategorize(duzelt(g.aciklama)); grup[k].items.push(g); grup[k].total += sayi(g.tutar); });
        let akordeon = '';
        KATEGORILER.forEach(([k, isim, ikon]) => {
            const g = grup[k];
            if (!g.items.length) return;
            akordeon += `
                <div class="kategori-item" data-kategori="${k}">
                    <div class="kategori-header">
                        <div class="kategori-name">${ikon} ${isim} <span style="color:#64748b;font-size:0.7rem;font-weight:600;">(${g.items.length} işlem)</span></div>
                        <div style="display:flex;align-items:center;"><span class="kategori-tutar">${tutarYaz(g.total)} ₺</span><span class="kategori-toggle">+</span></div>
                    </div>
                    <div class="kategori-body"><table><thead><tr><th>Tarih</th><th>Açıklama</th><th>Tür</th><th>Tutar</th></tr></thead><tbody>${g.items.map(x => giderSatiri(x)).join('')}</tbody></table></div>
                </div>`;
        });
        const nakit = sayilanlar.filter(g => g.tur !== 'kredi').reduce((s, g) => s + sayi(g.tutar), 0);
        const kredi = sayilanlar.filter(g => g.tur === 'kredi').reduce((s, g) => s + sayi(g.tutar), 0);
        if (!akordeon) return '';
        return `<div class="content-card"><div class="card-header">🗂️ ${ad} Kategori Detay${D.yazdirModu ? '' : ' (Basınca Açılır)'}</div><div class="card-body"><div class="kategori-list">${akordeon}</div><div class="info-note" style="margin-top:12px;">📌 Toplam Nakit: ${tutarYaz(nakit)} ₺ · Toplam Kredi: ${tutarYaz(kredi)} ₺ · Genel Toplam: ${tutarYaz(nakit + kredi)} ₺</div></div></div>`;
    }

    // 👤 Kime Ne Ödendi: aynı yere yapılan ödemeler bir arada (en çok ödenen üstte), kategori detayı gibi açılır
    function odemeYerleriHtml(ay) {
        const gruplar = {};
        tarihSirali((ay.giderler || []).filter(g => !g.haric)).forEach(g => {
            const y = odemeYeri(g.aciklama);
            if (!y) return;
            const gr = gruplar[y.anahtar] = gruplar[y.anahtar] || { adlar: {}, items: [], nakit: 0, kredi: 0 };
            gr.adlar[y.ad] = (gr.adlar[y.ad] || 0) + 1;
            gr.items.push(g);
            gr[g.tur === 'kredi' ? 'kredi' : 'nakit'] += sayi(g.tutar);
        });
        const liste = Object.keys(gruplar).map(k => {
            const g = gruplar[k];
            return Object.assign(g, { ad: Object.keys(g.adlar).sort((a, b) => g.adlar[b] - g.adlar[a])[0], toplam: g.nakit + g.kredi });
        }).sort((a, b) => b.toplam - a.toplam);
        if (!liste.length) return '';
        // ekranda en çok ödenen 12 yer; gerisi "Tümünü göster" ile açılır (PDF'te hepsi)
        const ILK = 12, gizli = D.yazdirModu ? 0 : Math.max(0, liste.length - ILK);
        const akordeon = liste.map((g, i) => `
            <div class="kategori-item${gizli && i >= ILK ? ' fazla' : ''}">
                <div class="kategori-header">
                    <div class="kategori-name">${esc(g.ad)} <span style="color:#64748b;font-size:0.7rem;font-weight:600;">(${g.items.length} ödeme${g.nakit && g.kredi ? ` · nakit ${tutarYaz(g.nakit)} · kredi ${tutarYaz(g.kredi)}` : (g.kredi ? ' · kredi/EFT' : ' · nakit')})</span></div>
                    <div style="display:flex;align-items:center;"><span class="kategori-tutar">${tutarYaz(g.toplam)} ₺</span><span class="kategori-toggle">+</span></div>
                </div>
                <div class="kategori-body"><table><thead><tr><th>Tarih</th><th>Açıklama</th><th>Tür</th><th>Tutar</th></tr></thead><tbody>${g.items.map(x => giderSatiri(x)).join('')}</tbody></table></div>
            </div>`).join('');
        return `<div class="content-card"><div class="card-header">👤 ${ayAdi(ay.id)} Kime Ne Ödendi${D.yazdirModu ? '' : ' (Basınca Açılır)'}</div><div class="card-body"><div class="kategori-list">${akordeon}</div>${gizli ? `<button type="button" class="tumunu-goster" data-tumu>▼ Tümünü göster (${gizli} yer daha)</button>` : ''}<div class="info-note" style="margin-top:12px;">📌 Aynı yere yapılan ödemeler açıklamadaki ada göre bir araya toplanır (kredi, kart, eft, nakit gibi sözcükler ve yazım hataları dikkate alınmaz). ${liste.length} farklı ödeme yeri.</div></div></div>`;
    }

    // ------------------------------------------------------------ sekmeler
    function ozetHtml(ay, yilAylari) {
        const h = hesapla(ay);
        const ad = ayAdi(ay.id), yil = ayParca(ay.id).yil;
        const ort = ortalama(yilAylari);
        // içinde bulunulan ayda ciro henüz gelmediyse kâr gösterilmez (yalnız gider görünüp "zarar" sanılmasın)
        const ciroBekleniyor = !h.brut && ay.id === yerelTarih(new Date()).slice(0, 7);
        const ayDevamEdiyor = !ciroBekleniyor && !D.yazdirModu && ay.id === yerelTarih(new Date()).slice(0, 7);
        const zarar = h.netKar < 0 && !ciroBekleniyor ? ' zarar' : '';
        const karMetni = ciroBekleniyor ? '—' : paraK(h.netKar) + ' ₺';
        const online = h.platformlar.map(p => `<div class="stat-card"><h4>${esc(p.ad)}</h4><div class="stat-number">${para(p.net, 2)} ₺</div></div>`).join('');
        const karZararSatir = (etiket, deger, k) => `<tr><td>${etiket}</td><td class="amount-right">${para(deger, k == null ? 2 : k)}</td></tr>`;
        // ortalamalar seçili yılın ayları üzerinden (eski raporda "6 AYLIK")
        const ortEtiket = ort.adet + ' AYLIK' + (yilListesi(aylarSirali(D.veri)).length > 1 ? ' ' + yil : '');
        const tk = takvimOzet(ay);
        // içinde bulunulan ayda günlük ortalama, ayın tüm günlerine değil satış olan günlere göre
        const gdTum = (ay.gunluk || []).length ? gunlukDurum(ay) : null;
        const gd = gdTum && gdTum.buAyMi && gdTum.satisli.length ? gdTum : null;
        return `
            ${bugunHtml(ay)}
            ${alarmlarHtml(ay)}
            ${borclarHtml(ay)}
            ${notlarHtml(ay)}
            <div class="content-card">
                <div class="card-header">📈 ${ad} (${h.calismaGunu} gün)</div>
                <div class="card-body">
                    ${tk ? `<div class="info-note takvim-notu">${esc(tk.metin)}</div>` : ''}
                    ${buAyNotu(ay)}
                    <div class="summary-stats">
                        <div class="stat-card"><h4>Brüt Ciro</h4><div class="stat-number">${paraK(h.brut)} ₺</div></div>
                        <div class="stat-card"><h4>Net Ciro</h4><div class="stat-number">${paraK(h.net)} ₺</div></div>
                        <div class="stat-card profit-card${zarar}"><h4>Net Kâr</h4><div class="stat-number">${karMetni}</div></div>
                    </div>
                    <div class="summary-stats">
                        <div class="stat-card avg-card"><h4>📊 GÜNLÜK ORTALAMA CİRO${gd ? ' (BUGÜNE KADAR)' : ''}</h4><div class="stat-number">${para(gd ? gd.ort : h.gunlukCiro, 2)} ₺/gün</div></div>
                        <div class="stat-card avg-card"><h4>📈 ${ortEtiket} AYLIK ORTALAMA</h4><div class="stat-number">${paraK(ort.aylik)} ₺/ay</div></div>
                        <div class="stat-card avg-card"><h4>📉 ${ortEtiket} GÜNLÜK ORTALAMA</h4><div class="stat-number">${para(ort.gunluk, 2)} ₺/gün</div></div>
                    </div>
                    ${online ? `<div class="summary-stats">${online}</div>` : ''}
                    <div class="summary-stats">
                        <div class="stat-card"><h4>Nakit Gider</h4><div class="stat-number">${paraK(h.nakitGider)} ₺</div></div>
                        <div class="stat-card"><h4>Kredi Gider</h4><div class="stat-number">${paraK(h.krediGider)} ₺</div></div>
                        <div class="stat-card"><h4>Personel</h4><div class="stat-number">${paraK(h.personelGider)} ₺</div></div>
                        ${h.ekGider ? `<div class="stat-card"><h4>Ek Gider</h4><div class="stat-number">${paraK(h.ekGider)} ₺</div></div>` : ''}
                    </div>
                    <div class="stat-card profit-card${zarar}" style="margin-top:6px;">
                        <h4 style="color:#ffecb3;">NET KAR</h4>
                        <div class="stat-number" style="color:#facc15;">${karMetni}</div>
                        <div style="color:#e2f0e6;font-size:0.7rem;">${ciroBekleniyor ? 'Ciro gelince hesaplanır' : paraK(h.net) + ' − ' + paraK(h.toplamGider)}</div>
                        ${ayDevamEdiyor ? `<div class="ay-bitmedi">⏳ Ay bitmedi: personel ayın tamamı için yazılı, ciro ve giderler bugüne kadar. Kâr ay sonunda netleşir.</div>` : ''}
                    </div>
                    <div class="stat-card kar-orani-card" style="margin-top:6px;">
                        <h4>📊 KÂR ORANI</h4>
                        <div class="stat-number">${ciroBekleniyor ? '—' : h.karOrani.toFixed(2) + '%'}</div>
                        <div style="color:#d1fae5;font-size:0.65rem;">Net Kâr / Net Ciro</div>
                    </div>
                </div>
            </div>
            <div class="content-card">
                <div class="card-header">📋 ${ad} Kar/Zarar</div>
                <div class="card-body">
                    <table>
                        <thead><tr><th>Kalem</th><th>Tutar (₺)</th></tr></thead>
                        <tbody>
                            ${karZararSatir('Brüt Ciro', h.brut)}
                            ${h.platformlar.map(p => karZararSatir(esc(p.ad) + ' (net)', p.net)).join('')}
                            ${karZararSatir('Net Ciro', h.net)}
                            ${karZararSatir('Nakit Gider', h.nakitGider)}
                            ${karZararSatir('Kredi Kartı/EFT', h.krediGider)}
                            ${karZararSatir('Personel', h.personelGider)}
                            ${(ay.ekGiderler || []).filter(e => sayi(e.tutar)).map(e => karZararSatir(esc(e.aciklama || 'Ek gider'), e.tutar)).join('')}
                            <tr class="total-row"><td><strong>Toplam Gider</strong></td><td class="amount-right"><strong>${para(h.toplamGider, 2)} ₺</strong></td></tr>
                            ${ciroBekleniyor ? `<tr style="background:#f1f5f9;"><td><strong>NET KÂR</strong></td><td class="amount-right"><strong>— (ciro gelince hesaplanır)</strong></td></tr>` : `
                            <tr style="background:${h.netKar < 0 ? '#fee2e2' : '#e6f7ec'};"><td><strong>NET KÂR</strong></td><td class="amount-right ${h.netKar < 0 ? 'negative' : 'positive'}"><strong>${para(h.netKar, 2)} ₺</strong></td></tr>
                            <tr style="background:#d1fae5;"><td><strong>KÂR ORANI</strong></td><td class="amount-right ${h.netKar < 0 ? 'negative' : 'positive'}"><strong>${h.karOrani.toFixed(2)}%</strong></td></tr>`}
                        </tbody>
                    </table>
                </div>
            </div>
            ${kategoriHtml(ay)}
            ${odemeYerleriHtml(ay)}`;
    }
    // ---- canlı "Bugün" kartı (patron ekranı): restorandaki program 30 sn'de bir SambaPOS'tan okuyup GitHub'daki canli
    // dalına yazar; sayfa açıkken dakikada bir okunur (GitHub saatte 60 okumaya izin verir; değişmeyen okuma sayılmaz).
    // Masaüstünde doğrudan /api/canli. Gelmezse aylık veriden gösterilir.
    const CANLI_SURE = 60000;
    function canliAdresleri() {
        if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return ['/api/canli'];
        const k = kok.OZ_CANLI;
        if (!k || !k.depo) return [];
        // önce GitHub API (1 dk önbellek); saatlik sınır dolarsa raw adresi (5 dk önbellek)
        return [`${k.api || 'https://api.github.com'}/repos/${k.depo}/contents/${k.dosya}?ref=${k.dal}`, `https://raw.githubusercontent.com/${k.depo}/${k.dal}/${k.dosya}`];
    }
    async function canliGetir() {
        for (const adres of canliAdresleri()) {
            try {
                const r = await fetch(adres, { cache: 'no-cache', headers: adres.indexOf('/contents/') > 0 ? { Accept: 'application/vnd.github.raw' } : {} });
                if (!r.ok) continue;
                const j = await r.json();
                if (j && j.ok && j.gun) { D.canli = j; bugunYenile(); return; }
            } catch (e) { /* çevrimdışı ya da erişilemedi: sıradaki adres */ }
        }
    }
    function canliBaslat() {
        if (D.canliZaman || D.yazdirModu || !canliAdresleri().length) return;
        canliGetir();
        D.canliZaman = setInterval(() => { if (document.visibilityState !== 'hidden') canliGetir(); }, CANLI_SURE);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') canliGetir(); });
    }
    function bugunYenile() {
        const el = D.kok && D.kok.querySelector('.bugun-kart');
        const ay = aylarSirali(D.veri).find(a => a.id === D.ay);
        if (el && ay) el.outerHTML = bugunHtml(ay);
    }
    // 30 dakikadan eski canlı bilgi kullanılmaz (restorandaki program kapalı olabilir); gece yarısından sonra açık iş günü sürer
    function canliGecerli() {
        const c = D.canli;
        if (!c || !c.gun || !((Date.now() - new Date(c.zaman).getTime()) / 60000 < 30)) return null;
        return c.gun === yerelTarih(new Date()) || c.acik ? c : null;
    }
    function masaIkon(tur) {
        const t = trKucuk(tur);
        return /masa/.test(t) ? '🍽️' : /paket/.test(t) ? '🛵' : /trendyol|ys |getir|migros|yemek/.test(t + ' ') ? '📦' : /müşteri/.test(t) ? '👤' : '🧾';
    }
    function sureYaz(t) {
        const dk = Math.max(0, Math.round((Date.now() - new Date(t).getTime()) / 60000));
        return dk < 60 ? dk + ' dk' : Math.floor(dk / 60) + ' sa ' + (dk % 60) + ' dk';
    }
    // açık adisyonlar tek satır özet; "Detay" ile liste, bir adisyona basınca içindeki ürünler (yenilemede açık kalır)
    function acikMasalarHtml(c) {
        const am = c.acikMasalar || {};
        if (!sayi(am.adet)) return `<div class="acik-masalar bos">✅ Açık adisyon yok, bütün hesaplar kapanmış.</div>`;
        const odenmemis = sayi(am.kalan) !== sayi(am.toplam) ? ` · ödenmemiş <b>${paraK(am.kalan)} ₺</b>` : '';
        const acilan = D.acikAdisyonlar || {};
        const liste = (am.liste || []).map(m => {
            const ac = !!acilan[m.no], urunler = m.urunler || [];
            const kismi = sayi(m.kalan) && sayi(m.kalan) !== sayi(m.toplam) ? ` · ${paraK(sayi(m.toplam) - sayi(m.kalan))} ₺ ödendi` : '';
            return `<div class="adisyon${ac ? ' acik' : ''}" data-adisyon="${esc(m.no)}">
                <div class="adisyon-baslik"><span>${masaIkon(m.tur)} ${esc(m.ad || 'Adisyon ' + m.no)}</span><span class="adisyon-sag"><b>${paraK(sayi(m.kalan) || sayi(m.toplam))} ₺</b> · ${sureYaz(m.acilis)} ${ac ? '▾' : '▸'}</span></div>
                ${ac ? `<div class="adisyon-icerik">${urunler.map(u => `<div class="urun"><span>${tutarYaz(u.adet)} × ${esc(u.ad)}${u.porsiyon ? ' (' + esc(u.porsiyon) + ')' : ''}</span><span>${u.ikram ? 'ikram / iptal' : paraK(u.tutar) + ' ₺'}</span></div>`).join('') || '<div class="urun">Ürün yok</div>'}
                    <div class="urun alt"><span>Adisyon ${esc(m.no)} · açılış ${new Date(m.acilis).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })}${kismi}</span><span>Toplam ${paraK(m.toplam)} ₺</span></div></div>` : ''}
            </div>`;
        }).join('');
        return `<div class="acik-masalar">
            <button type="button" class="acik-ozet" data-acik-detay>🧾 Açık adisyon: <b>${am.adet}</b> · toplam <b>${paraK(am.toplam)} ₺</b>${odenmemis}<span class="detay-dugme">${D.acikDetay ? 'Gizle ▴' : 'Detay ▾'}</span></button>
            ${D.acikDetay ? `<div class="adisyon-listesi">${liste}</div>` : ''}
        </div>`;
    }
    // 📍 Bugün: içinde bulunulan ayda özetin en üstünde bugünkü ciro + açık masalar + bugünkü giderler (ay bitince görünmez)
    function bugunHtml(ay) {
        const simdi = new Date(), bugun = yerelTarih(simdi);
        if (D.yazdirModu || ay.id !== bugun.slice(0, 7)) return '';
        const d = (ay.gunluk || []).length ? gunlukDurum(ay) : null;
        const c = canliGecerli();
        let g = d ? d.gunler.find(x => x.tarih === bugun) : null;
        if (c) {
            // canlı: SambaPOS'un şu anki hâli (iş günü başından beri)
            const kom = komisyonOrani(ay), ciro = c.ciro || {};
            const nakit = sayi(ciro.nakit), kredi = sayi(ciro.kredi);
            const online = Object.keys(ciro).filter(k => k !== 'nakit' && k !== 'kredi').reduce((s, k) => s + sayi(ciro[k]), 0);
            // online platformlar ayrı ayrı (Trendyol, Yemeksepeti ...)
            const platformYazi = PLATFORMLAR.filter(([k]) => sayi(ciro[k])).map(([k, ad]) => `📦 ${ad} ${paraK(ciro[k])} ₺`).join(' · ');
            g = { nakit, kredi, online, platformYazi, brut: nakit + kredi + online, net: nakit + kredi + online * (1 - kom), adisyon: sayi((c.adisyon || {}).adet) };
        }
        const dunT = yerelTarih(new Date(simdi.getFullYear(), simdi.getMonth(), simdi.getDate() - 1));
        const dun = d ? d.gunler.find(x => x.tarih === dunT) : null;
        const giderler = tarihSirali(c ? (c.giderler || []) : (ay.giderler || []).filter(x => String(x.tarih || '').slice(0, 10) === bugun));
        const sayilan = giderler.filter(x => !x.haric);
        const nakitG = sayilan.filter(x => x.tur !== 'kredi').reduce((s, x) => s + sayi(x.tutar), 0);
        const krediG = sayilan.filter(x => x.tur === 'kredi').reduce((s, x) => s + sayi(x.tutar), 0);
        const kapali = ay.takvim && ay.takvim.aktif ? !(takvimGunleri(ay.id, ay.takvim)[simdi.getDate() - 1] || {}).acik : false;
        const baslik = simdi.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' });
        const saat = ay.sonSenkron ? new Date(ay.sonSenkron).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '';
        // restoran yalnız değişince gönderir: "x dk önce" yaşlanıyormuş gibi görünmesin diye son bilginin saati
        const sagUst = c ? `<span class="bugun-saat canli">🟢 Canlı · ${new Date(c.zaman).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })}</span>` : (saat ? `<span class="bugun-saat">🔄 SambaPOS ${saat}</span>` : '');
        const gunKapandi = c && !c.acik && c.kapanis ? ` · 🔒 Gün sonu alındı (${new Date(c.kapanis).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })})` : '';
        const ciroVar = g && g.brut;
        return `<div class="content-card bugun-kart">
            <div class="card-header">📍 Bugün — ${esc(baslik)}${sagUst}</div>
            <div class="card-body">
                <div class="summary-stats">
                    <div class="stat-card"><h4>Bugünkü Ciro (Brüt)</h4><div class="stat-number">${ciroVar ? paraK(g.brut) + ' ₺' : '—'}</div></div>
                    <div class="stat-card profit-card"><h4>Bugünkü Net Ciro</h4><div class="stat-number">${ciroVar ? paraK(g.net) + ' ₺' : '—'}</div></div>
                    <div class="stat-card"><h4>Adisyon</h4><div class="stat-number">${g ? g.adisyon : 0}</div></div>
                    <div class="stat-card"><h4>Bugünkü Gider</h4><div class="stat-number">${paraK(nakitG + krediG)} ₺</div></div>
                </div>
                ${c ? acikMasalarHtml(c) : ''}
                ${aylarSirali(D.veri).filter(a => a.id <= ay.id).slice(0, 3).filter(a => ['kiragunu', 'gecikti'].indexOf(kiraHali(a)) >= 0)
                    .map(a => `<div class="info-note kira-hatirlat">🏠 ${esc(kiraVadeMetni(a))}</div>`).join('')}
                ${taksitHatirlatmalari(ay)}
                <div class="info-note" style="margin-top:0">${ciroVar
                    ? `💵 Nakit ${paraK(g.nakit)} ₺ · 💳 Kredi ${paraK(g.kredi)} ₺ · ${g.platformYazi || '📦 Online ' + paraK(g.online) + ' ₺'}`
                    : (kapali ? '🚫 Bugün kapalı gün.' : '⏳ Bugün henüz satış görünmüyor.')}${gunKapandi}${dun && dun.brut ? ` · Dün: <b>${paraK(dun.net)} ₺</b> net` : ''}${giderler.length ? ` · Gider: nakit ${paraK(nakitG)} ₺, kredi/EFT ${paraK(krediG)} ₺` : ''}</div>
                ${giderler.length ? `<div class="table-wrapper" style="margin-top:8px"><table><thead><tr><th>Saat</th><th>Açıklama</th><th>Tür</th><th>Tutar</th></tr></thead><tbody>${giderler.map(x => giderSatiri(x)).join('')}<tr class="total-row"><td colspan="3"><strong>Bugünkü toplam gider</strong></td><td class="amount-right"><strong>${tutarYaz(nakitG + krediG)} ₺</strong></td></tr></tbody></table></div>` : ''}
            </div>
        </div>`;
    }
    // içinde bulunulan ay: bugüne kadarki ciro ve ay sonu tahmini (özet sayfasının üstünde)
    function buAyNotu(ay) {
        if (ay.id === yerelTarih(new Date()).slice(0, 7) && !hesapla(ay).brut)
            return `<div class="info-note bu-ay-notu">⏳ <b>${ayAdi(ay.id)} verileri SambaPOS'tan bekleniyor.</b> Ciro ve günlük ciro geldikçe kendiliğinden dolacak; personel, borç ve kira önceki aydan kopyalandı.</div>`;
        if (!(ay.gunluk || []).length) return '';
        const d = gunlukDurum(ay);
        if (!d.buAyMi || !d.satisli.length) return '';
        const son = d.satisli[d.satisli.length - 1];
        return `<div class="info-note bu-ay-notu">📅 <b>Bugüne kadar</b> (${d.satisli.length} günde, son: ${gunEtiketi(son)}): <b>${paraK(d.net)} ₺</b> net · günlük ort. <b>${para(d.ort)} ₺</b> · kalan ${d.kalan} açık gün · <b>ay sonu tahmini ≈ ${para(d.tahmin)} ₺</b>${ay.sonSenkron ? ` · 🔄 SambaPOS: ${new Date(ay.sonSenkron).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}` : ''}</div>`;
    }
    function gunlukHtml(ay) {
        const ad = ayAdi(ay.id);
        const d = gunlukDurum(ay);
        const enBuyuk = d.satisli.reduce((m, g) => Math.max(m, g.net), 0) || 1;
        const satirlar = d.gunler.filter(g => !(d.buAyMi && g.gelecek)).map(g => {
            if (g.kapali && !g.brut) return `<tr class="kapali-gun"><td style="white-space:nowrap;">${gunEtiketi(g)}</td><td colspan="6" style="text-align:center;">🚫 kapalı</td></tr>`;
            const yuzde = Math.round(g.net / enBuyuk * 100);
            const isaret = d.enIyi && g.tarih === d.enIyi.tarih ? ' 🏆' : '';
            return `<tr${g.bugun ? ' class="bugun-satir"' : ''}><td style="white-space:nowrap;">${gunEtiketi(g)}${g.bugun ? ' <b>(bugün)</b>' : ''}</td>
                <td class="amount-right">${g.nakit ? paraK(g.nakit) : '—'}</td><td class="amount-right">${g.kredi ? paraK(g.kredi) : '—'}</td><td class="amount-right">${g.online ? paraK(g.online) : '—'}</td>
                <td class="amount-right">${g.brut ? paraK(g.brut) : '—'}</td>
                <td class="amount-right"><b>${g.brut ? paraK(g.net) : '—'}</b>${isaret}${g.brut ? `<div class="gun-bar"><span style="width:${yuzde}%"></span></div>` : ''}</td>
                <td class="amount-right">${g.adisyon || '—'}</td></tr>`;
        }).join('');
        const top = d.satisli.reduce((t, g) => { t.nakit += g.nakit; t.kredi += g.kredi; t.online += g.online; return t; }, { nakit: 0, kredi: 0, online: 0 });
        return `
            <div class="content-card">
                <div class="card-header">📅 ${ad} Günlük Ciro</div>
                <div class="card-body">
                    <div class="summary-stats">
                        <div class="stat-card"><h4>${d.buAyMi ? 'Bugüne Kadar Net' : 'Net Ciro'}</h4><div class="stat-number">${paraK(d.net)} ₺</div></div>
                        <div class="stat-card"><h4>Satış Olan Gün</h4><div class="stat-number">${d.satisli.length}</div></div>
                        <div class="stat-card avg-card"><h4>📊 Günlük Ortalama (Net)</h4><div class="stat-number">${para(d.ort)} ₺</div></div>
                        ${d.buAyMi ? `<div class="stat-card kar-orani-card"><h4>🔮 Ay Sonu Tahmini</h4><div class="stat-number" style="font-size:1rem">≈ ${para(d.tahmin)} ₺</div><div style="color:#d1fae5;font-size:0.6rem;">kalan ${d.kalan} açık gün × günlük ort.</div></div>` : ''}
                    </div>
                    <div class="summary-stats">
                        ${d.enIyi ? `<div class="stat-card"><h4>🏆 En İyi Gün</h4><div class="stat-number" style="font-size:0.85rem">${gunEtiketi(d.enIyi)} · ${paraK(d.enIyi.net)} ₺</div></div>` : ''}
                        ${d.enDusuk ? `<div class="stat-card"><h4>⚠️ En Düşük Gün</h4><div class="stat-number" style="font-size:0.85rem">${gunEtiketi(d.enDusuk)} · ${paraK(d.enDusuk.net)} ₺</div></div>` : ''}
                        <div class="stat-card"><h4>Adisyon</h4><div class="stat-number" style="font-size:0.85rem">${d.adisyon} · ort. ${d.adisyon ? para(d.brut / d.adisyon) : 0} ₺</div></div>
                    </div>
                    <div class="table-wrapper"><table><thead><tr><th>Gün</th><th class="amount-right">Nakit</th><th class="amount-right">Kredi</th><th class="amount-right">Online</th><th class="amount-right">Toplam</th><th class="amount-right">Net</th><th class="amount-right" title="Adisyon sayısı">Adis.</th></tr></thead>
                    <tbody>${satirlar}<tr class="total-row"><td><strong>Toplam</strong></td><td class="amount-right">${paraK(top.nakit)}</td><td class="amount-right">${paraK(top.kredi)}</td><td class="amount-right">${paraK(top.online)}</td><td class="amount-right"><strong>${paraK(d.brut)}</strong></td><td class="amount-right"><strong>${paraK(d.net)}</strong></td><td class="amount-right">${d.adisyon}</td></tr></tbody></table></div>
                    <div class="info-note">📌 Günler SambaPOS iş gününe göredir (gece yarısından sonraki satış o iş gününe sayılır). Online tutarlar brüt; Net sütununda komisyon düşülmüştür. SambaPOS'ta olmayan platformlar (elle girilen) günlük tabloda yer almaz.</div>
                </div>
            </div>`;
    }
    function personelHtml(ay) {
        const ad = ayAdi(ay.id);
        const liste = personelEtkin(ay);
        const satirlar = liste.map(p => `<tr><td>${esc(p.ad)}</td><td class="amount-right">${sayi(p.gunluk) > 0 ? para(p.gunluk) + ' ₺' : '-'}</td><td class="amount-right">${sayi(p.gun) > 0 ? sayi(p.gun) : '-'}</td><td class="amount-right">${tutarYaz(p.toplam)} ₺</td></tr>`).join('');
        const toplam = liste.reduce((s, p) => s + sayi(p.toplam), 0);
        return `<div class="content-card" style="border:3px solid #f59e0b;box-shadow:0 10px 30px rgba(245,158,11,0.3);"><div class="card-header" style="background:linear-gradient(135deg,#fef3c7,#fde68a);color:#78350f;font-size:1.05rem;">👥 ${ad} PERSONEL</div><div class="card-body"><div class="table-wrapper"><table><thead><tr><th>Personel</th><th>Günlük</th><th>Gün</th><th>Toplam</th></tr></thead><tbody>${satirlar}<tr class="total-row"><td colspan="3"><strong>Toplam</strong></td><td class="amount-right"><strong>${tutarYaz(toplam)} ₺</strong></td></tr></tbody></table></div></div></div>`;
    }
    function nakitHtml(ay) {
        return giderTablosu(ay, `💰 ${ayAdi(ay.id)} Kasadan Yapılan Nakit Giderler`, (ay.giderler || []).filter(g => g.tur !== 'kredi'), 'Toplam Nakit');
    }
    function krediHtml(ay) {
        return giderTablosu(ay, `💳 ${ayAdi(ay.id)} Yusuf Usta Kredi & EFT Giderleri`, (ay.giderler || []).filter(g => g.tur === 'kredi'), 'Toplam Kredi', 'Kredi/EFT');
    }
    function tumGiderHtml(ay) {
        const h = hesapla(ay);
        const liste = tarihSirali(ay.giderler || []);
        const ekler = (ay.ekGiderler || []).filter(e => sayi(e.tutar));
        let satirlar = liste.map(g => giderSatiri(g)).join('');
        satirlar += ekler.map(e => `<tr><td>-</td><td>${esc(e.aciklama)}</td><td><span class="method-ek">Ek Gider</span></td><td class="amount-right">${tutarYaz(e.tutar)} ₺</td></tr>`).join('');
        let toplamlar = `<tr class="total-row"><td colspan="3"><strong>Toplam (Nakit+Kredi)</strong></td><td class="amount-right"><strong>${tutarYaz(h.nakitGider + h.krediGider)} ₺</strong></td></tr>`;
        if (ekler.length) toplamlar += `<tr class="total-row"><td colspan="3"><strong>Toplam (Nakit+Kredi+Ek)</strong></td><td class="amount-right"><strong>${tutarYaz(h.nakitGider + h.krediGider + h.ekGider)} ₺</strong></td></tr>`;
        return `<div class="content-card"><div class="card-header">📋 ${ayAdi(ay.id)} Genel Tüm Giderler</div><div class="card-body"><div class="table-wrapper"><table><thead><tr><th>Tarih</th><th>Açıklama</th><th>Tür</th><th>Tutar</th></tr></thead><tbody>${satirlar}${toplamlar}</tbody></table></div><div class="info-note" style="margin-top:10px;font-size:0.7rem;">📌 Personel: ${para(h.personelGider)} TL<br>📌 Toplam Gider: ${para(h.toplamGider)} TL</div></div></div>`;
    }
    function karsilastirmaHtml(yilAylari) {
        const yil = yilAylari.length ? ayParca(yilAylari[0].id).yil : '';
        const hesaplar = yilAylari.map(a => hesapla(a));
        // yon: 1 = yüksek iyi, -1 = düşük iyi (giderler), 0 = işaretleme yok
        const metrikler = [
            ['Çalışma Günü', h => h.calismaGunu, 0, 1],
            ['Brüt Ciro (₺)', h => h.brut, 0, 1],
            ['Net Ciro (₺)', h => h.net, 0, 1],
            ['Günlük Ort. Ciro (₺)', h => h.gunlukCiro, 0, 1],
            ['Nakit Gider (₺)', h => h.nakitGider, 0, -1],
            ['Kredi Gider (₺)', h => h.krediGider, 0, -1],
            ['Personel (₺)', h => h.personelGider, 0, -1],
            ['Ek Gider (₺)', h => h.ekGider, 0, -1],
            ['Toplam Gider (₺)', h => h.toplamGider, 0, -1],
            ['Net Kâr (₺)', h => h.netKar, 0, 1],
            ['Kâr Oranı (%)', h => h.karOrani, 2, 1]
        ];
        let satirlar = '';
        metrikler.forEach(([etiket, fn, k, yon]) => {
            const v = hesaplar.map(fn);
            if (etiket.startsWith('Ek Gider') && !v.some(x => x)) return;
            const enIyi = yon > 0 ? Math.max(...v) : Math.min(...v), enKotu = yon > 0 ? Math.min(...v) : Math.max(...v);
            satirlar += `<tr><td><strong>${etiket}</strong></td>${v.map(x => {
                const ikon = !yon || enIyi === enKotu ? '' : (x === enIyi ? ' 🏆' : (x === enKotu ? ' ⚠️' : ''));
                return `<td class="amount-right">${k ? para(x, k) : paraK(x)}${ikon}</td>`;
            }).join('')}</tr>`;
        });
        const ort = ortalama(yilAylari);
        const cokYil = yilListesi(aylarSirali(D.veri)).length > 1;
        return `
            <div class="content-card">
                <div class="card-header">📊 ${yilAylari.length} Aylık Analiz${cokYil ? ' · ' + yil : ''}</div>
                <div class="card-body">
                    <div class="summary-stats">
                        <div class="stat-card avg-card"><h4>📈 ${yilAylari.length} AYLIK ORTALAMA</h4><div class="stat-number">${paraK(ort.aylik)} ₺/ay</div></div>
                        <div class="stat-card avg-card"><h4>📊 GÜNLÜK ORTALAMA</h4><div class="stat-number">${para(ort.gunluk, 2)} ₺/gün</div></div>
                    </div>
                    <h3 style="font-size:0.9rem;margin:10px 0;">📋 Metrikler <span style="font-size:0.65rem;color:#64748b;font-weight:600;">🏆 en iyi · ⚠️ en kötü (giderde en düşük en iyidir)</span></h3>
                    <div class="table-wrapper"><table><thead><tr><th>Metrik</th>${yilAylari.map(a => `<th class="amount-right">${ayAdi(a.id)}</th>`).join('')}</tr></thead><tbody>${satirlar}</tbody></table></div>
                </div>
            </div>`;
    }
    function footerHtml(yilAylari) {
        const satirlar = [];
        if (yilAylari.length) satirlar.push('⚡ ' + yilAylari.map(a => `${ayAdi(a.id)} ${calismaGunuAy(a)}g`).join(' · ') + (D.veri.calismaNotu ? ` (${esc(D.veri.calismaNotu)})` : ''));
        // kira: yılın ayları sırayla (Nisan ✅ · … · Ekim ⏳)
        const kiraAylari = yilAylari.filter(a => kiraHali(a)).slice().reverse();
        const isaret = { odendi: '✅', bekliyor: '⏳', kiragunu: '⏰', gecikti: '❌' };
        if (kiraAylari.length) satirlar.push('🏠 Kira: ' + kiraAylari.map(a => `${ayAdi(a.id)} ${isaret[kiraHali(a)]}`).join(' · ') + ' (✅ ödendi · ⏳ günü gelmedi · ❌ ödenmedi)');
        // en güncel kaydı esas al: orada borç bitmişse (ya da artık yoksa) eski ayların kopyası alt bilgide görünmez
        const alarmAy = yilAylari.find(a => (a.alarmlar || []).length);
        if (alarmAy) gosterilenAlarmlar(alarmAy).forEach(a => {
            const p = takipPlani(alarmAy, a);
            satirlar.push(p ? `${esc(a.ikon || '⚡')} ${esc(cumleYaz(a.baslik))}: ${p.odenen} taksit ödendi, kalan ${p.kalanAdet} taksit (${para(p.kalanTutar, 2)} ₺)${p.siradaki && p.siradaki.tarih ? ' · sıradaki ' + gunAyYaz(p.siradaki.tarih) : ''} (gidere dahil değil)`
                : `${esc(a.ikon || '⚡')} ${esc(cumleYaz(a.baslik))}: Toplam ${para(a.toplam, 2)} ₺${sayi(a.taksitSayisi) ? ` · ${sayi(a.taksitSayisi)} taksit × ${para(a.taksit)} ₺` : ''}${a.ilkOdeme ? ` · İlk taksit ${esc(a.ilkOdeme)}` : ''} (Gidere dahil değil)`);
        });
        (D.veri.genelNotlar || []).filter(n => String(n).trim()).forEach(n => satirlar.push(esc(n)));
        if (D.veri.guncelleme) {
            const t = new Date(D.veri.guncelleme);
            if (!isNaN(t)) satirlar.push('🕒 Son güncelleme: ' + t.toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }));
        }
        return `<div class="footer">${satirlar.join('<br>')}</div>`;
    }

    // ------------------------------------------------------------ çizim / durum
    function ciz() {
        if (!D.kok) return;
        const aylar = aylarSirali(D.veri);
        if (!aylar.length) {
            D.kok.innerHTML = `<div class="dashboard ana">${brandHtml(aylar)}<div class="content-card"><div class="bos-ay">Henüz ay yok. Üstteki “PDF Yükle”, “SambaPOS'tan Çek” ya da “Yeni Ay” ile başlayın.</div></div></div>`;
            return;
        }
        if (!aylar.some(a => a.id === D.ay)) D.ay = aylar[0].id;
        const yil = ayParca(D.ay).yil;
        const yilAylari = aylar.filter(a => ayParca(a.id).yil === yil);
        const ay = aylar.find(a => a.id === D.ay);
        if (sekmeler(ay).indexOf(D.sekme) < 0) D.sekme = 'ozet';
        const icerik = {
            ozet: () => ozetHtml(ay, yilAylari), gunluk: () => gunlukHtml(ay), personel: () => personelHtml(ay), nakit: () => nakitHtml(ay),
            kredi: () => krediHtml(ay), tumgider: () => tumGiderHtml(ay), karsilastirma: () => karsilastirmaHtml(yilAylari)
        }[D.sekme]();
        D.kok.innerHTML = `<div class="dashboard ana">${brandHtml(aylar)}${yilBarHtml(aylar)}${ayBarHtml(yilAylari)}${altBarHtml(ay)}<div id="tabContent">${icerik}</div>${footerHtml(yilAylari)}</div>`;
        document.title = `${D.veri.isletme ? baslikYaz(D.veri.isletme) : 'Öz Urfa Kebap'} | ${ayAdi(aylar[0].id)} ${ayParca(aylar[0].id).yil} Komple Rapor`;
        try { history.replaceState(null, '', '#' + D.ay + '/' + D.sekme); } catch (e) { /* file:// */ }
        if (D.secenek.degisti) D.secenek.degisti(D.ay, D.sekme);
    }
    function baslikYaz(s) { return trKucuk(s).split(' ').map(w => w ? w[0].toLocaleUpperCase('tr-TR') + w.slice(1) : w).join(' '); }
    function kaydir() {
        const el = D.kok && D.kok.querySelector('.sub-button-bar');
        if (el) window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 70), behavior: 'smooth' });
    }
    function tikla(e) {
        const t = e.target.closest('[data-yil],[data-ay],[data-sekme],[data-islem],[data-tumu],[data-acik-detay],.adisyon-baslik,.kategori-header');
        if (!t || !D.kok.contains(t)) return;
        if (t.dataset.islem) { if (D.secenek.islem) D.secenek.islem(t.dataset.islem); return; }
        if (t.hasAttribute('data-acik-detay')) { D.acikDetay = !D.acikDetay; bugunYenile(); return; }
        if (t.classList.contains('adisyon-baslik')) {
            const no = t.parentElement.dataset.adisyon;
            D.acikAdisyonlar = D.acikAdisyonlar || {};
            D.acikAdisyonlar[no] = !D.acikAdisyonlar[no];
            bugunYenile();
            return;
        }
        if (t.hasAttribute('data-tumu')) { t.previousElementSibling.classList.add('hepsi'); t.remove(); return; }
        if (t.classList.contains('kategori-header')) { t.parentElement.classList.toggle('open'); return; }
        if (t.dataset.yil) {
            const ilk = aylarSirali(D.veri).find(a => ayParca(a.id).yil === +t.dataset.yil);
            if (ilk) { D.ay = ilk.id; D.sekme = 'ozet'; }
            ciz(); return;
        }
        if (t.dataset.ay) { D.ay = t.dataset.ay; D.sekme = 'ozet'; ciz(); kaydir(); return; }
        if (t.dataset.sekme) { D.sekme = t.dataset.sekme; ciz(); kaydir(); }
    }
    function hashOku() {
        const m = /^#(\d{4}-\d{2})(?:\/(\w+))?/.exec(location.hash || '');
        if (!m) return false;
        const sekme = m[2] || 'ozet';
        if (m[1] === D.ay && sekme === D.sekme) return false;
        D.ay = m[1]; D.sekme = sekme;
        return true;
    }
    function baslat(kokEl, veri, secenek) {
        D.kok = kokEl; D.veri = veri || { aylar: [] }; D.secenek = secenek || {};
        hashOku();
        kokEl.addEventListener('click', tikla);
        window.addEventListener('hashchange', () => { if (hashOku()) ciz(); });
        ciz();
        canliBaslat();
    }
    function guncelle(veri, ayId) {
        D.veri = veri || { aylar: [] };
        if (ayId) { D.ay = ayId; D.sekme = 'ozet'; }
        ciz();
    }

    // ------------------------------------------------------------ PDF / yazdırma görünümü
    // kapsam: "2026-09" (o ay), "2026" (o yılın tüm ayları); boşsa en son ay
    function yazdirHtml(veri, kapsam) {
        const onceki = D.veri;
        D.veri = veri || { aylar: [] };
        D.yazdirModu = true;
        try {
            const aylar = aylarSirali(D.veri);
            let secilen;
            if (/^\d{4}-\d{2}$/.test(kapsam || '')) secilen = aylar.filter(a => a.id === kapsam);
            else if (/^\d{4}$/.test(kapsam || '')) secilen = aylar.filter(a => String(ayParca(a.id).yil) === kapsam);
            else secilen = aylar.slice(0, 1);
            if (!secilen.length) return `<div class="dashboard yazdir">${brandHtml(aylar)}<div class="bos-ay">Bu kapsamda ay yok: ${esc(kapsam)}</div></div>`;
            const yil = ayParca(secilen[0].id).yil;
            const yilAylari = aylar.filter(a => ayParca(a.id).yil === yil);
            const kapsamAdi = secilen.length === 1 ? `${ayAdi(secilen[0].id)} ${yil}` : `${yil} yılı (${secilen.length} ay)`;
            const simdi = new Date().toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            let html = brandHtml(aylar) + `<div class="info-note" style="margin:-8px 0 14px;">🖨️ PDF rapor · ${kapsamAdi} · Oluşturma: ${simdi}</div>`;
            secilen.forEach((ay, i) => {
                html += `<div class="yazdir-ay-baslik${i ? ' yeni-sayfa' : ''}">${ayIkon(ay.id)} ${ayAdi(ay.id)} ${ayParca(ay.id).yil}</div>`;
                html += ozetHtml(ay, yilAylari) + ((ay.gunluk || []).length ? gunlukHtml(ay) : '') + personelHtml(ay) + nakitHtml(ay) + krediHtml(ay);
            });
            if (secilen.length > 1) html += `<div class="yazdir-ay-baslik yeni-sayfa">📈 ${yil} Ay Karşılaştırma</div>` + karsilastirmaHtml(yilAylari);
            html += footerHtml(yilAylari);
            return `<div class="dashboard yazdir">${html}</div>`;
        } finally { D.veri = onceki; D.yazdirModu = false; }
    }

    // ------------------------------------------------------------ yayınlanan tek dosyalık sayfa
    function sayfaBaslat() {
        let veri;
        try { veri = JSON.parse(document.getElementById('ozurfa-veri').textContent); } catch (e) { veri = { aylar: [] }; }
        const kokEl = document.getElementById('rapor');
        const q = new URLSearchParams(location.search);
        if (q.has('yazdir')) {
            D.veri = veri;
            kokEl.innerHTML = yazdirHtml(veri, q.get('yazdir'));
            document.title = 'Öz Urfa Kebap | PDF Rapor ' + q.get('yazdir');
            return;
        }
        const alan = document.createElement('div');
        alan.id = 'yazdirAlan';
        document.body.appendChild(alan);
        baslat(kokEl, veri, {
            yayinAraci: true,
            islem: ad => {
                if (ad === 'indir') sayfayiIndir();
                else { alan.innerHTML = yazdirHtml(veri, D.ay); document.body.classList.add('yazdirma'); setTimeout(() => window.print(), 60); }
            }
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('yazdirma'); alan.innerHTML = ''; });
    }
    function sayfayiIndir() {
        const ad = 'OzUrfa-Rapor-' + (D.ay || 'rapor') + '.html';
        const kaydet = metin => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([metin], { type: 'text/html;charset=utf-8' }));
            a.download = ad;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        };
        const kaynak = () => {
            const k = document.documentElement.cloneNode(true);
            const r = k.querySelector('#rapor'); if (r) r.innerHTML = '';
            k.querySelectorAll('#yazdirAlan').forEach(x => x.remove());
            return '<!DOCTYPE html>\n' + k.outerHTML;
        };
        if (/^https?:/.test(location.protocol)) fetch(location.href.split('#')[0], { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(); return r.text(); }).then(kaydet, () => kaydet(kaynak()));
        else kaydet(kaynak());
    }

    const OzRapor = {
        AY_ADLARI, PLATFORMLAR, KATEGORILER, HAFTA_GUNLERI,
        baslat, guncelle, ciz, yazdirHtml, sayfaBaslat,
        secili: () => ({ ay: D.ay, sekme: D.sekme }),
        hesapla, odemeTuru, otomatikHaric, kategorize, calismaGunuHesapla, takvimGunleri, takvimOzet, calismaGunuAy, personelEtkin, gunlukDurum,
        duzelt, odemeYeri, taksitPlani, borcBitti, DUZELTMELER,
        ayAdi, ayParca, aylarSirali, para, sayi, tutarYaz, esc, trKucuk, tarihKisa
    };
    kok.OzRapor = OzRapor;
    if (typeof module !== 'undefined' && module.exports) module.exports = OzRapor;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>OzRapor.sayfaBaslat();</script>
